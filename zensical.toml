[project]
site_name = "Guía de inicio EchidnaML"
site_description = "Guía para iniciarse con EchidnaML y la placa EchidnaBlack2 basada en proyectos sencillos"
site_author = "Echidna Educación"
site_url = "https://echidnaeducacion.github.io/GuiaInicioEchidnaML/"
copyright = "Contenido bajo licencia CC BY-SA 4.0"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/stylesheets/extra.css"]
nav = [
  {"Inicio" = "index.md"},
  {"1. Introducción" = "01-introduccion.md"},
  {"2. Proyectos con EchidnaBlocks" = [
    "02-echidnablocks/index.md",
    {"2.1 Hola Mundo" = "02-echidnablocks/01-hola-mundo.md"},
    {"2.2 Semáforo" = "02-echidnablocks/02-semaforo.md"},
    {"2.3 Pulsadores" = "02-echidnablocks/03-pulsadores.md"},
    {"2.4 Zumbador" = "02-echidnablocks/04-zumbador.md"},
    {"2.5 Interruptor crepuscular" = "02-echidnablocks/05-interruptor-crepuscular.md"},
    {"2.6 Makey Makey" = "02-echidnablocks/06-makey-makey.md"},
    {"2.7 El echidna dice la temperatura" = "02-echidnablocks/07-echidna-dice-temperatura.md"},
    {"2.8 Mezclamos colores" = "02-echidnablocks/08-mezclamos-colores.md"},
    {"2.9 Vúmetro" = "02-echidnablocks/09-vumetro.md"},
    {"2.10 Telesketch" = "02-echidnablocks/10-telesketch.md"},
    {"2.11 Movemos el echidna" = "02-echidnablocks/11-movemos-el-echidna.md"}
  ]},
  {"3. Proyectos con IA" = [
    "03-ia/index.md",
    {"3.1 Asistente virtual" = "03-ia/01-asistente-virtual.md"},
    {"3.2 Clasificador de residuos" = "03-ia/02-clasificador-residuos.md"}
  ]},
  {"4. Licencia" = "04-licencia.md"}
]

[project.theme]
language = "es"
variant = "modern"
logo = "assets/images/favicon.png"
favicon = "assets/images/favicon.png"
features = [
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "content.code.copy"
]

[project.theme.font]
text = "Open Sans"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep orange"
accent = "light blue"

[project.theme.palette.toggle]
icon = "material/weather-night"
name = "Cambiar a modo oscuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep orange"
accent = "light blue"

[project.theme.palette.toggle]
icon = "material/weather-sunny"
name = "Cambiar a modo claro"

[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.fenced_code]
